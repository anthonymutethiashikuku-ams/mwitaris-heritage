<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mwitari's Heritage</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="login-container">

        <h1>Mwitari's Heritage</h1>
        <p>Member Login</p>

        <form onsubmit="login(event)">

            <input 
    type="email" 
    id="username" 
    placeholder="Email Address"
    required
              >
              <div class="password-container">

    <input 
        type="password" 
        id="password" 
        placeholder="Password"
        required
    >

    <button
        type="button"
        class="show-password"
        onclick="togglePassword()"
    >
        👁️
    </button>

              </div>


            <button type="submit">Login</button>

        </form>
<br>
<br>

<button
    type="button"
    onclick="location.href='forgot-password.html'"
>
    Forgot Password?
</button>
        
<p>Are you an administrator?</p>

<button onclick="location.href='admin-login.html'">
    Administrator Login
</button>
      <p>Not yet a member?</p>

<button onclick="location.href='register.html'">
    Create Member Account
</button>
    </div>

    <script type="module" src="script.js"></script>
    <script>
function togglePassword() {
    const password = document.getElementById("password");

    if (password.type === "password") {
        password.type = "text";
    } else {
        password.type = "password";
    }
}
    </script>
</body>
</html>
