<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Member Balances | Mwitari's Heritage</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="admin-container">

    <h1>Member Balances</h1>

    <button onclick="window.location.href='admin-dashboard.html'">
        ← Back to Admin Dashboard
    </button>

    <hr>

    <div id="loading">
        Loading member balances...
    </div>

    <table border="1" cellpadding="10" width="100%" id="balanceTable">

        <thead>

            <tr>
                <th>Member</th>
                <th>Member No.</th>
                <th>Loan</th>
                <th>Paid</th>
                <th>Loan Balance</th>
                <th>Savings</th>
            </tr>

        </thead>

        <tbody id="balanceBody"></tbody>

    </table>

</div>


<script type="module">

import { auth, db } from "./firebase.js";

import {
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import {
    collection,
    getDocs,
    doc,
    getDoc
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


const balanceBody =
    document.getElementById("balanceBody");

const loading =
    document.getElementById("loading");


onAuthStateChanged(auth, async (user) => {

    if (!user) {

        window.location.href =
            "admin-login.html";

        return;

    }

    const adminSnap =
        await getDoc(
            doc(db, "members", user.uid)
        );

    if (
        !adminSnap.exists() ||
        adminSnap.data().role !== "admin"
    ) {

        alert("Access denied.");

        window.location.href =
            "dashboard.html";

        return;

    }

    loadBalances();

});


async function loadBalances() {

    try {

        const snapshot =
            await getDocs(
                collection(db, "members")
            );

        snapshot.forEach((memberDoc) => {

            const data =
                memberDoc.data();

            const loan =
                Number(data.loanAmount) || 0;

            const paid =
                Number(data.loanPaid) || 0;

            const balance =
                Math.max(loan - paid, 0);

            const savings =
                Number(data.savingsBalance) || 0;

            const row =
                document.createElement("tr");

            row.innerHTML = `

                <td>${data.fullName || "N/A"}</td>

                <td>${data.memberNumber || "N/A"}</td>

                <td>KSh ${loan.toLocaleString()}</td>

                <td>KSh ${paid.toLocaleString()}</td>

                <td>KSh ${balance.toLocaleString()}</td>

                <td>KSh ${savings.toLocaleString()}</td>

            `;

            balanceBody.appendChild(row);

        });

        loading.style.display =
            "none";

    } catch (error) {

        console.error(error);

        loading.textContent =
            "Unable to load member balances.";

    }

}

</script>

</body>
</html>
