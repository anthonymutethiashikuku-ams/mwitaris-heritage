<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Mwitari's Heritage - Registration</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="login-container">

    <h1>Mwitari's Heritage</h1>

    <p>Member Registration</p>

    <form id="registerForm">

        <!-- Full Name -->
        <input
            type="text"
            id="fullName"
            placeholder="Full Name"
            required
        >

        <!-- Membership Number -->
        <input
            type="text"
            id="memberNumber"
            placeholder="Membership Number"
            required
        >

        <!-- Email -->
        <input
            type="email"
            id="email"
            placeholder="Email Address"
            required
        >

        <!-- Phone -->
        <input
            type="tel"
            id="phone"
            placeholder="Phone Number"
            required
        >

        <!-- Password -->
        <input
            type="password"
            id="password"
            placeholder="Create Password"
            minlength="6"
            required
        >

        <!-- Confirm Password -->
        <input
            type="password"
            id="confirmPassword"
            placeholder="Confirm Password"
            minlength="6"
            required
        >

        <!-- Recovery Question -->
        <select id="recoveryQuestion" required>

            <option value="">
                Select a recovery question
            </option>

            <option value="mother_maiden_name">
                What is your mother's maiden name?
            </option>

            <option value="first_school">
                What was the name of your first school?
            </option>

            <option value="childhood_friend">
                What was the name of your childhood best friend?
            </option>

            <option value="favorite_teacher">
                What was the name of your favorite teacher?
            </option>

        </select>

        <!-- Recovery Answer -->
        <input
            type="text"
            id="recoveryAnswer"
            placeholder="Answer to recovery question"
            required
        >

        <!-- Register -->
        <button type="submit">
            Create Account
        </button>

    </form>

    <br>

    <!-- Back to Login -->
    <button onclick="location.href='index.html'">
        Back to Login
    </button>

</div>


<script type="module">

import { auth, db } from "./firebase.js";

import {
    createUserWithEmailAndPassword
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import {
    doc,
    setDoc
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


// Convert recovery answer into a SHA-256 hash
async function hashAnswer(answer) {

    const normalizedAnswer =
        answer.trim().toLowerCase();

    const encoder =
        new TextEncoder();

    const data =
        encoder.encode(normalizedAnswer);

    const hashBuffer =
        await crypto.subtle.digest(
            "SHA-256",
            data
        );

    const hashArray =
        Array.from(
            new Uint8Array(hashBuffer)
        );

    return hashArray
        .map(
            byte => byte.toString(16).padStart(2, "0")
        )
        .join("");
}


// Registration form
document
    .getElementById("registerForm")
    .addEventListener("submit", async function(event) {

        event.preventDefault();


        // Get form values
        const fullName =
            document
                .getElementById("fullName")
                .value
                .trim();


        const memberNumber =
            document
                .getElementById("memberNumber")
                .value
                .trim();


        const email =
            document
                .getElementById("email")
                .value
                .trim();


        const phone =
            document
                .getElementById("phone")
                .value
                .trim();


        const password =
            document
                .getElementById("password")
                .value;


        const confirmPassword =
            document
                .getElementById("confirmPassword")
                .value;


        const recoveryQuestion =
            document
                .getElementById("recoveryQuestion")
                .value;


        const recoveryAnswer =
            document
                .getElementById("recoveryAnswer")
                .value
                .trim();


        // Check passwords
        if (password !== confirmPassword) {

            alert(
                "The passwords do not match."
            );

            return;
        }


        // Check recovery question
        if (!recoveryQuestion) {

            alert(
                "Please select a recovery question."
            );

            return;
        }


        // Check recovery answer
        if (!recoveryAnswer) {

            alert(
                "Please provide an answer to the recovery question."
            );

            return;
        }


        try {

            // Create Firebase Authentication account
            const userCredential =
                await createUserWithEmailAndPassword(
                    auth,
                    email,
                    password
                );


            const user =
                userCredential.user;


            // Hash the recovery answer
            const recoveryAnswerHash =
                await hashAnswer(
                    recoveryAnswer
                );


            // Save member information in Firestore
            await setDoc(
                doc(
                    db,
                    "members",
                    user.uid
                ),
                {

                    uid: user.uid,

                    fullName: fullName,

                    memberNumber: memberNumber,

                    email: email,

                    phone: phone,

                    role: "member",


                    // Loan information
                    loanAmount: 0,

                    loanRepaid: 0,

                    loanBalance: 0,


                    // Savings
                    savings: 0,


                    // Bank information
                    bankName: "",

                    accountNumber: "",


                    // Account recovery
                    recoveryQuestion:
                        recoveryQuestion,

                    recoveryAnswerHash:
                        recoveryAnswerHash

                }
            );


            alert(
                "Registration successful! You can now log in."
            );


            // Return to login page
            window.location.href =
                "index.html";


        } catch (error) {

            console.error(error);


            if (
                error.code ===
                "auth/email-already-in-use"
            ) {

                alert(
                    "This email is already registered."
                );


            } else if (
                error.code ===
                "auth/weak-password"
            ) {

                alert(
                    "Password must be at least 6 characters."
                );


            } else if (
                error.code ===
                "auth/invalid-email"
            ) {

                alert(
                    "Please enter a valid email address."
                );


            } else {

                alert(
                    "Registration failed: " +
                    error.message
                );

            }

        }

    });

</script>

</body>
    </html>
