<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Manage Bylaws - Mwitari's Heritage</title>

    <link rel="stylesheet" href="style.css">

    <style>

        /* ==================================================
           BYLAWS PAGE
        ================================================== */

        .bylaw-admin-container {
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
            text-align: left;
        }


        /* ==================================================
           RICH TEXT TOOLBAR
        ================================================== */

        .editor-toolbar {

            display: flex;

            flex-wrap: wrap;

            align-items: center;

            gap: 6px;

            width: 100%;

            margin: 12px 0 8px;

        }


        /*
         IMPORTANT:

         style.css contains a global:

         button {
             width: 100%;
         }

         Therefore we MUST override it here.
        */

        .editor-toolbar button {

            width: auto;

            min-width: 46px;

            flex: 0 0 auto;

            padding: 9px 13px;

            margin: 0;

            border: 1px solid #ccc;

            border-radius: 6px;

            background: #f5f5f5;

            color: #0B3D91;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

        }


        .editor-toolbar button:hover {

            background: #e0e0e0;

        }


        .editor-toolbar button:active {

            transform: scale(0.97);

        }


        .editor-toolbar select {

            width: auto;

            min-width: 130px;

            flex: 0 0 auto;

            padding: 9px 10px;

            margin: 0;

            border: 1px solid #ccc;

            border-radius: 6px;

            background: white;

            color: #0B3D91;

            font-size: 15px;

        }


        /* ==================================================
           EDITOR
        ================================================== */

        #bylawContent {

            width: 100%;

            min-height: 260px;

            padding: 15px;

            margin-top: 5px;

            border: 1px solid #aaa;

            border-radius: 8px;

            background: white;

            color: #000000;

            text-align: left;

            line-height: 1.6;

            overflow-y: auto;

            outline: none;

        }


        #bylawContent:focus {

            border-color: #0B3D91;

            box-shadow:
                0 0 0 2px
                rgba(11, 61, 145, 0.15);

        }


        #bylawContent h1 {

            font-size: 28px;

            margin: 12px 0;

        }


        #bylawContent h2 {

            font-size: 24px;

            margin: 10px 0;

        }


        #bylawContent h3 {

            font-size: 20px;

            margin: 8px 0;

        }


        #bylawContent h4 {

            font-size: 18px;

            margin: 8px 0;

        }


        #bylawContent ul,
        #bylawContent ol {

            padding-left: 30px;

            margin: 8px 0;

        }


        #bylawContent p {

            margin: 6px 0;

        }


        /* ==================================================
           DISPLAYED BYLAWS
        ================================================== */

        .bylaw-item {

            width: 100%;

            padding: 18px;

            margin-bottom: 20px;

            border: 1px solid #ccc;

            border-radius: 10px;

            background: rgba(255,255,255,0.92);

            text-align: left;

        }


        .bylaw-item h3 {

            color: #0B3D91;

            margin-bottom: 12px;

        }


        .bylaw-content {

            color: #000000;

            text-align: left;

            line-height: 1.6;

        }


        .bylaw-content h1,
        .bylaw-content h2,
        .bylaw-content h3,
        .bylaw-content h4 {

            color: #0B3D91;

            margin-top: 12px;

            margin-bottom: 8px;

        }


        .bylaw-content ul,
        .bylaw-content ol {

            padding-left: 30px;

            margin: 8px 0;

        }


        .bylaw-content p {

            margin: 6px 0;

        }


        /* ==================================================
           EDIT / DELETE BUTTONS
        ================================================== */

        .bylaw-actions {

            display: flex;

            flex-wrap: wrap;

            gap: 8px;

            margin-top: 15px;

        }


        .bylaw-actions button {

            width: auto;

            flex: 0 0 auto;

            padding: 10px 16px;

        }


        /* ==================================================
           MOBILE
        ================================================== */

        @media (max-width: 600px) {

            .editor-toolbar {

                gap: 5px;

            }


            .editor-toolbar button {

                min-width: 42px;

                padding: 8px 10px;

                font-size: 15px;

            }


            .editor-toolbar select {

                min-width: 120px;

                padding: 8px;

            }


            #bylawContent {

                min-height: 230px;

            }

        }

    </style>

</head>


<body>


<div class="login-container">


    <div class="bylaw-admin-container">


        <h1>📜 Manage Bylaws</h1>


        <p id="loadingMessage">
            Checking administrator access...
        </p>


        <div id="adminContent"
             style="display:none;">


            <!-- ==================================================
                 ADD / EDIT FORM
            ================================================== -->

            <h2 id="formHeading">
                Add New Bylaw
            </h2>


            <form id="bylawForm">


                <input
                    type="text"
                    id="bylawTitle"
                    placeholder="Bylaw Title"
                    required
                >


                <!-- ==================================================
                     FORMATTING TOOLBAR
                ================================================== -->

                <div
                    class="editor-toolbar"
                    aria-label="Text formatting tools"
                >


                    <button
                        type="button"
                        class="format-button"
                        data-command="bold"
                        title="Bold"
                        aria-label="Bold"
                    >
                        <b>B</b>
                    </button>


                    <button
                        type="button"
                        class="format-button"
                        data-command="italic"
                        title="Italic"
                        aria-label="Italic"
                    >
                        <i>I</i>
                    </button>


                    <button
                        type="button"
                        class="format-button"
                        data-command="underline"
                        title="Underline"
                        aria-label="Underline"
                    >
                        <u>U</u>
                    </button>


                    <select
                        id="headingSelect"
                        title="Text style"
                        aria-label="Text style"
                    >

                        <option value="">
                            Paragraph
                        </option>

                        <option value="h1">
                            Heading 1
                        </option>

                        <option value="h2">
                            Heading 2
                        </option>

                        <option value="h3">
                            Heading 3
                        </option>

                        <option value="h4">
                            Heading 4
                        </option>

                    </select>


                    <button
                        type="button"
                        class="format-button"
                        data-command="insertUnorderedList"
                        title="Bullet List"
                        aria-label="Bullet List"
                    >
                        • List
                    </button>


                    <button
                        type="button"
                        class="format-button"
                        data-command="insertOrderedList"
                        title="Numbered List"
                        aria-label="Numbered List"
                    >
                        1. List
                    </button>


                    <button
                        type="button"
                        class="format-button"
                        data-command="removeFormat"
                        title="Clear Formatting"
                        aria-label="Clear Formatting"
                    >
                        Clear
                    </button>


                </div>


                <!-- ==================================================
                     EDITOR
                ================================================== -->

                <div
                    id="bylawContent"
                    contenteditable="true"
                    role="textbox"
                    aria-multiline="true"
                    spellcheck="true"
                ></div>


                <br>


                <input
                    type="number"
                    id="bylawOrder"
                    placeholder="Order (e.g. 1, 2, 3...)"
                    min="1"
                    step="1"
                    required
                >


                <br><br>


                <button
                    type="submit"
                    id="saveButton"
                >
                    ➕ Add Bylaw
                </button>


                <button
                    type="button"
                    id="cancelEditButton"
                    style="display:none;"
                >
                    Cancel Edit
                </button>


            </form>


            <p id="message"></p>


            <hr>


            <!-- ==================================================
                 EXISTING BYLAWS
            ================================================== -->

            <h2>
                Existing Bylaws
            </h2>


            <div id="bylawsList">

                Loading bylaws...

            </div>


            <br>


            <button
                type="button"
                onclick="location.href='admin-dashboard.html'"
            >
                ← Admin Dashboard
            </button>


        </div>

    </div>

</div>


<script type="module">


/* =========================================================
   FIREBASE
========================================================= */

import {
    auth,
    db
} from "./firebase.js";


import {
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


import {
    collection,
    getDocs,
    doc,
    getDoc,
    addDoc,
    updateDoc,
    deleteDoc,
    query,
    orderBy
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* =========================================================
   ELEMENTS
========================================================= */

const loadingMessage =
    document.getElementById("loadingMessage");


const adminContent =
    document.getElementById("adminContent");


const bylawForm =
    document.getElementById("bylawForm");


const message =
    document.getElementById("message");


const bylawsList =
    document.getElementById("bylawsList");


const bylawTitle =
    document.getElementById("bylawTitle");


const bylawContent =
    document.getElementById("bylawContent");


const bylawOrder =
    document.getElementById("bylawOrder");


const formHeading =
    document.getElementById("formHeading");


const saveButton =
    document.getElementById("saveButton");


const cancelEditButton =
    document.getElementById("cancelEditButton");


const headingSelect =
    document.getElementById("headingSelect");


/* =========================================================
   EDITING STATE
========================================================= */

let editingBylawId = null;


/*
    This stores the exact highlighted selection.

    It is the key part that fixes the problem where
    only the beginning of a line was being formatted.
*/

let savedSelection = null;


/* =========================================================
   ADMIN AUTHENTICATION
========================================================= */

onAuthStateChanged(
    auth,
    async function(user) {


        if (!user) {

            window.location.href =
                "admin-login.html";

            return;

        }


        try {


            const adminRef =
                doc(
                    db,
                    "members",
                    user.uid
                );


            const adminSnap =
                await getDoc(
                    adminRef
                );


            if (
                !adminSnap.exists() ||
                adminSnap.data().role !== "admin"
            ) {


                alert(
                    "Administrator access required."
                );


                window.location.href =
                    "dashboard.html";


                return;

            }


            loadingMessage.textContent =
                "";


            adminContent.style.display =
                "block";


            await loadBylaws();


        } catch (error) {


            console.error(
                "Administrator verification error:",
                error
            );


            loadingMessage.textContent =
                "Unable to verify administrator.";

        }

    }
);


/* =========================================================
   SELECTION MANAGEMENT
========================================================= */


/*
    Check whether a selection belongs to our editor.
*/

function selectionIsInsideEditor(range) {


    if (!range) {

        return false;

    }


    return (
        bylawContent.contains(
            range.commonAncestorContainer
        )
    );

}


/*
    Save the currently highlighted text.
*/

function saveCurrentSelection() {


    const selection =
        window.getSelection();


    if (
        !selection ||
        selection.rangeCount === 0
    ) {

        return;

    }


    const range =
        selection.getRangeAt(0);


    if (
        selectionIsInsideEditor(range)
    ) {


        savedSelection =
            range.cloneRange();

    }

}


/*
    Restore the highlighted text.
*/

function restoreSavedSelection() {


    if (!savedSelection) {

        return false;

    }


    if (
        !selectionIsInsideEditor(
            savedSelection
        )
    ) {

        return false;

    }


    const selection =
        window.getSelection();


    selection.removeAllRanges();


    selection.addRange(
        savedSelection
    );


    return true;

}


/*
    The browser fires selectionchange whenever the
    highlighted area changes.

    We save it continuously while the admin works.
*/

document.addEventListener(
    "selectionchange",
    function() {

        saveCurrentSelection();

    }
);


/*
    Additional ways of capturing selection,
    especially useful on mobile browsers.
*/

bylawContent.addEventListener(
    "mouseup",
    saveCurrentSelection
);


bylawContent.addEventListener(
    "keyup",
    saveCurrentSelection
);


bylawContent.addEventListener(
    "touchend",
    function() {

        setTimeout(
            saveCurrentSelection,
            0
        );

    }
);


/* =========================================================
   FORMATTING COMMANDS
========================================================= */


/*
    Apply B / I / U / Lists / Clear.

    IMPORTANT:
    We use pointerdown rather than simply clicking the
    button because clicking the toolbar can otherwise
    cause the browser to lose the highlighted selection.
*/

document
    .querySelectorAll(".format-button")
    .forEach(function(button) {


        button.addEventListener(
            "pointerdown",
            function(event) {


                /*
                    Stop the toolbar button from stealing
                    the editor selection.
                */

                event.preventDefault();


                /*
                    Capture selection immediately before
                    formatting.
                */

                saveCurrentSelection();


                /*
                    Put the exact highlighted text back.
                */

                restoreSavedSelection();


                const command =
                    button.dataset.command;


                try {


                    document.execCommand(
                        command,
                        false,
                        null
                    );


                } catch (error) {


                    console.error(
                        "Formatting error:",
                        error
                    );

                }


                /*
                    Save the new selection after formatting.
                */

                saveCurrentSelection();


                bylawContent.focus();

            }

        );

    });


/* =========================================================
   HEADINGS
========================================================= */

headingSelect.addEventListener(
    "change",
    function() {


        const selectedHeading =
            this.value;


        if (!selectedHeading) {

            return;

        }


        /*
            Restore the selection that existed before
            the dropdown was touched.
        */

        restoreSavedSelection();


        try {


            document.execCommand(
                "formatBlock",
                false,
                selectedHeading
            );


        } catch (error) {


            console.error(
                "Heading formatting error:",
                error
            );

        }


        saveCurrentSelection();


        bylawContent.focus();


        this.value = "";

    }
);


/*
    Save the selection before the heading menu receives focus.
*/

headingSelect.addEventListener(
    "pointerdown",
    function() {

        saveCurrentSelection();

    }
);


/* =========================================================
   ADD / UPDATE BYLAW
========================================================= */

bylawForm.addEventListener(
    "submit",
    async function(event) {


        event.preventDefault();


        const title =
            bylawTitle.value.trim();


        /*
            Take exactly what the administrator created
            in the rich-text editor.

            Then sanitize it before storing it.
        */

        const content =
            sanitizeHTML(
                bylawContent.innerHTML
            );


        const order =
            Number(
                bylawOrder.value
            );


        if (
            !title ||
            !stripHTML(content).trim() ||
            !Number.isInteger(order) ||
            order < 1
        ) {


            message.textContent =
