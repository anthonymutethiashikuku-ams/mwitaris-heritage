<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Member Management - Mwitari's Heritage</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="login-container">

    <h1>👥 Member Management</h1>

    <p>Search for a registered member.</p>

    <input
        type="text"
        id="searchNumber"
        placeholder="Membership Number"
    >

    <button id="searchButton">
        Search Member
    </button>

    <br><br>

    <div id="memberDetails"></div>

    <br>

    <button onclick="location.href='admin-dashboard.html'">
        ← Admin Dashboard
    </button>

</div>


<script type="module">

import { auth, db } from "./firebase.js";

import {
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import {
    collection,
    getDocs,
    doc,
    updateDoc
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


const searchButton =
    document.getElementById("searchButton");

const searchNumber =
    document.getElementById("searchNumber");

const memberDetails =
    document.getElementById("memberDetails");


// ==========================================
// CHECK ADMIN LOGIN
// ==========================================

onAuthStateChanged(auth, async (user) => {

    if (!user) {

        window.location.href =
            "admin-login.html";

        return;
    }

    try {

        const adminRef =
            doc(db, "members", user.uid);

        const adminSnap =
            await getDocs(
                collection(db, "members")
            );

        let currentAdmin = null;

        adminSnap.forEach((memberDoc) => {

            if (memberDoc.id === user.uid) {

                currentAdmin =
                    memberDoc.data();

            }

        });


        if (
            !currentAdmin ||
            currentAdmin.role !== "admin"
        ) {

            alert(
                "Access denied. Administrator privileges are required."
            );

            window.location.href =
                "dashboard.html";

        }

    } catch (error) {

        console.error(
            "Admin verification error:",
            error
        );

        memberDetails.innerHTML =
            "<p>Unable to verify administrator.</p>";
    }

});


// ==========================================
// SEARCH MEMBER
// ==========================================

searchButton.addEventListener(
    "click",
    searchMember
);


async function searchMember() {

    const number =
        searchNumber.value.trim();

    if (!number) {

        memberDetails.innerHTML =
            "<p>Please enter a membership number.</p>";

        return;
    }


    memberDetails.innerHTML =
        "<p>Searching...</p>";


    try {

        const snapshot =
            await getDocs(
                collection(db, "members")
            );


        let foundMember = null;

        let foundId = null;


        snapshot.forEach((memberDoc) => {

            const data =
                memberDoc.data();


            if (
                data.memberNumber &&
                data.memberNumber.toLowerCase() ===
                number.toLowerCase()
            ) {

                foundMember =
                    data;

                foundId =
                    memberDoc.id;

            }

        });


        if (!foundMember) {

            memberDetails.innerHTML =
                "<p>Member not found.</p>";

            return;
        }


        displayMember(
            foundMember,
            foundId
        );


    } catch (error) {

        console.error(
            "Search error:",
            error
        );

        memberDetails.innerHTML =
            "<p>Unable to load member information.</p>" +
            "<p>" + error.message + "</p>";
    }

}


// ==========================================
// DISPLAY MEMBER
// ==========================================

function displayMember(
    member,
    memberId
) {

    memberDetails.innerHTML = `

        <h2>Member Details</h2>

        <form id="memberForm">

            <label>Full Name</label>

            <input
                type="text"
                id="name"
                value="${escapeHTML(member.fullName || "")}"
                required
            >


            <label>Phone Number</label>

            <input
                type="text"
                id="phone"
                value="${escapeHTML(member.phone || "")}"
                required
            >


            <label>Email Address</label>

            <input
                type="email"
                id="email"
                value="${escapeHTML(member.email || "")}"
                required
            >


            <label>Membership Number</label>

            <input
                type="text"
                value="${escapeHTML(member.memberNumber || "")}"
                disabled
            >


            <h3>Bank Details</h3>


            <label>Bank Name</label>

            <input
                type="text"
                id="bank"
                value="${escapeHTML(member.bank || "")}"
            >


            <label>Account Number</label>

            <input
                type="text"
                id="account"
                value="${escapeHTML(member.account || "")}"
            >


            <button type="submit">
                Update Member
            </button>

        </form>

        <p id="updateMessage"></p>

    `;


    document
        .getElementById("memberForm")
        .addEventListener(
            "submit",
            function(event) {

                updateMember(
                    event,
                    memberId
                );

            }
        );

}


// ==========================================
// UPDATE MEMBER
// ==========================================

async function updateMember(
    event,
    memberId
) {

    event.preventDefault();


    const updateMessage =
        document.getElementById(
            "updateMessage"
        );


    updateMessage.textContent =
        "Saving changes...";


    try {

        await updateDoc(
            doc(
                db,
                "members",
                memberId
            ),
            {

                fullName:
                    document
                    .getElementById("name")
                    .value
                    .trim(),

                phone:
                    document
                    .getElementById("phone")
                    .value
                    .trim(),

                email:
                    document
                    .getElementById("email")
                    .value
                    .trim(),

                bank:
                    document
                    .getElementById("bank")
                    .value
                    .trim(),

                account:
                    document
                    .getElementById("account")
                    .value
                    .trim()

            }
        );


        updateMessage.textContent =
            "✅ Member information updated successfully.";

    } catch (error) {

        console.error(
            "Update error:",
            error
        );

        updateMessage.textContent =
            "❌ Unable to update member: " +
            error.message;

    }

}


// ==========================================
// BASIC HTML ESCAPING
// ==========================================

function escapeHTML(value) {

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

</script>

</body>

    </html>
