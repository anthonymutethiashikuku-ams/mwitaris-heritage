<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Mwitari's Heritage - Admin Login</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="login-container">

    <h1>Mwitari's Heritage</h1>

    <p>Administrator Login</p>


    <form id="adminLoginForm">

        <input
            type="email"
            id="adminEmail"
            placeholder="Administrator Email"
            autocomplete="email"
            required
        >


        <input
            type="password"
            id="adminPassword"
            placeholder="Administrator Password"
            autocomplete="current-password"
            required
        >


        <button type="submit" id="loginButton">
            Administrator Login
        </button>

    </form>


    <p id="loginMessage"></p>


    <br>


    <button onclick="location.href='index.html'">
        Back to Member Login
    </button>

</div>


<script type="module">

import { auth, db } from "./firebase.js";

import {
    signInWithEmailAndPassword,
    signOut
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import {
    doc,
    getDoc
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";



const form =
    document.getElementById("adminLoginForm");

const message =
    document.getElementById("loginMessage");

const loginButton =
    document.getElementById("loginButton");



form.addEventListener("submit", async function(event) {

    event.preventDefault();


    const email =
        document.getElementById("adminEmail")
        .value
        .trim();

    const password =
        document.getElementById("adminPassword")
        .value;


    if (!email || !password) {

        message.textContent =
            "Please enter your administrator email and password.";

        return;
    }


    loginButton.disabled = true;

    loginButton.textContent =
        "Checking...";

    message.textContent =
        "Authenticating administrator...";


    try {

        /*
        ==========================================
        STEP 1
        Firebase Authentication
        ==========================================
        */

        const userCredential =
            await signInWithEmailAndPassword(
                auth,
                email,
                password
            );


        const user =
            userCredential.user;


        console.log(
            "Firebase Authentication successful."
        );

        console.log(
            "Administrator UID:",
            user.uid
        );

        console.log(
            "Administrator email:",
            user.email
        );



        /*
        ==========================================
        STEP 2
        Find the administrator's Firestore record
        ==========================================
        */

        const adminRef =
            doc(
                db,
                "members",
                user.uid
            );


        const adminSnap =
            await getDoc(adminRef);



        /*
        ==========================================
        STEP 3
        Check whether the document exists
        ==========================================
        */

        if (!adminSnap.exists()) {

            await signOut(auth);


            message.textContent =
                "Authentication succeeded, but no administrator record was found in the members collection.";

            console.error(
                "No Firestore document found for UID:",
                user.uid
            );


            loginButton.disabled = false;

            loginButton.textContent =
                "Administrator Login";

            return;
        }



        /*
        ==========================================
        STEP 4
        Read administrator information
        ==========================================
        */

        const adminData =
            adminSnap.data();


        console.log(
            "Administrator Firestore data:",
            adminData
        );

        console.log(
            "Administrator role:",
            adminData.role
        );



        /*
        ==========================================
        STEP 5
        Verify administrator role
        ==========================================
        */

        if (adminData.role !== "admin") {

            await signOut(auth);


            message.textContent =
                "Login successful, but this account is not an administrator. The Firestore role must be exactly: admin";


            console.error(
                "Incorrect administrator role:",
                adminData.role
            );


            loginButton.disabled = false;

            loginButton.textContent =
                "Administrator Login";

            return;
        }



        /*
        ==========================================
        STEP 6
        Administrator confirmed
        ==========================================
        */

        message.textContent =
            "Administrator verified. Opening dashboard...";


        console.log(
            "ADMINISTRATOR VERIFIED"
        );


        window.location.href =
            "admin-dashboard.html";



    } catch (error) {

        /*
        ==========================================
        DISPLAY THE ACTUAL FIREBASE ERROR
        ==========================================
        */

        console.error(
            "ADMIN LOGIN ERROR:",
            error
        );

        console.error(
            "Error code:",
            error.code
        );

        console.error(
            "Error message:",
            error.message
        );


        let errorMessage =
            "Login failed.";


        /*
        Firebase Authentication errors
        */

        if (
            error.code ===
            "auth/invalid-credential"
        ) {

            errorMessage =
                "Invalid administrator email or password.";

        }

        else if (
            error.code ===
            "auth/user-not-found"
        ) {

            errorMessage =
                "No Firebase account exists with this email.";

        }

        else if (
            error.code ===
            "auth/wrong-password"
        ) {

            errorMessage =
                "The administrator password is incorrect.";

        }

        else if (
            error.code ===
            "auth/invalid-email"
        ) {

            errorMessage =
                "The administrator email address is invalid.";

        }

        else if (
            error.code ===
            "auth/too-many-requests"
        ) {

            errorMessage =
                "Too many login attempts. Please wait and try again.";

        }

        else if (
            error.code ===
            "permission-denied"
        ) {

            errorMessage =
                "Firestore permission denied. Check your Firestore Security Rules.";

        }

        else {

            errorMessage =
                "Firebase error: " +
                error.code +
                " — " +
                error.message;

        }


        message.textContent =
            errorMessage;


        loginButton.disabled = false;

        loginButton.textContent =
            "Administrator Login";

    }

});

</script>

</body>
</html>
