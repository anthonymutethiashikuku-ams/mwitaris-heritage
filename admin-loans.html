<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Loan Management - Mwitari's Heritage</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="login-container">

    <h1>💰 Loan Management</h1>

    <p id="loadingMessage">
        Checking administrator access...
    </p>

    <div id="applications"></div>

    <br>

    <button onclick="location.href='admin-dashboard.html'">
        ← Admin Dashboard
    </button>

</div>


<script type="module">

import { auth, db } from "./firebase.js";

import {
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import {
    collection,
    getDocs,
    doc,
    getDoc,
    updateDoc,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


const loadingMessage =
    document.getElementById("loadingMessage");

const applications =
    document.getElementById("applications");


// ==========================================
// CHECK ADMINISTRATOR
// ==========================================

onAuthStateChanged(auth, async (user) => {

    if (!user) {

        window.location.href =
            "admin-login.html";

        return;
    }


    try {

        const adminRef =
            doc(db, "members", user.uid);

        const adminSnap =
            await getDoc(adminRef);


        if (
            !adminSnap.exists() ||
            adminSnap.data().role !== "admin"
        ) {

            alert(
                "Administrator access required."
            );

            window.location.href =
                "dashboard.html";

            return;
        }


        loadingMessage.textContent =
            "Loading loan applications...";


        await loadApplications();


    } catch (error) {

        console.error(
            "Admin verification error:",
            error
        );

        loadingMessage.textContent =
            "Unable to verify administrator.";

    }

});


// ==========================================
// LOAD APPLICATIONS
// ==========================================

async function loadApplications() {

    try {

        const snapshot =
            await getDocs(
                collection(
                    db,
                    "loanApplications"
                )
            );


        loadingMessage.textContent = "";


        if (snapshot.empty) {

            applications.innerHTML = `

                <p>
                    No loan applications found.
                </p>

            `;

            return;
        }


        let html = "";


        snapshot.forEach((applicationDoc) => {

            const application =
                applicationDoc.data();

            const applicationId =
                applicationDoc.id;


            const approvedAmount =
                Number(
                    application.approvedAmount ||
                    application.loanAmount ||
                    0
                );


            const loanPaid =
                Number(
                    application.loanPaid || 0
                );


            const loanBalance =
                Math.max(
                    approvedAmount - loanPaid,
                    0
                );


            html += `

                <div
                    style="
                        border: 1px solid #ccc;
                        padding: 15px;
                        margin-bottom: 20px;
                        border-radius: 8px;
                    "
                >

                    <h2>
                        ${escapeHTML(
                            application.memberName ||
                            "Unknown Member"
                        )}
                    </h2>


                    <p>

                        <strong>
                            Membership Number:
                        </strong>

                        ${escapeHTML(
                            application.memberNumber ||
                            ""
                        )}

                    </p>


                    <p>

                        <strong>
                            Requested Loan:
                        </strong>

                        KSh
                        ${Number(
                            application.loanAmount || 0
                        ).toLocaleString()}

                    </p>


                    <p>

                        <strong>
                            Purpose:
                        </strong>

                        ${escapeHTML(
                            application.purpose || ""
                        )}

                    </p>


                    <p>

                        <strong>
                            Repayment Period:
                        </strong>

                        ${escapeHTML(
                            application.repaymentPeriod || ""
                        )}

                    </p>


                    <p>

                        <strong>
                            Status:
                        </strong>

                        ${escapeHTML(
                            application.status ||
                            "pending"
                        )}

                    </p>


                    <hr>


                    <h3>
                        Loan Financial Details
                    </h3>


                    <label>
                        Approved Loan Amount
                    </label>

                    <input
                        type="number"
                        id="approved-${applicationId}"
                        value="${approvedAmount}"
                        min="0"
                        step="1"
                    >


                    <br><br>


                    <label>
                        Amount Paid
                    </label>

                    <input
                        type="number"
                        id="paid-${applicationId}"
                        value="${loanPaid}"
                        min="0"
                        step="1"
                        oninput="calculateBalance('${applicationId}')"
                    >


                    <br><br>


                    <p>

                        <strong>
                            Outstanding Balance:
                        </strong>

                        <span
                            id="balance-${applicationId}"
                        >
                            KSh ${loanBalance.toLocaleString()}
                        </span>

                    </p>


                    <br>


                    <textarea
                        id="comment-${applicationId}"
                        placeholder="Administrator comment"
                        rows="3"
                        style="width:100%;"
                    >${escapeHTML(
                        application.adminComment || ""
                    )}</textarea>


                    <br><br>


                    <button
                        onclick="saveLoan('${applicationId}')"
                    >
                        💾 Save Loan Information
                    </button>


                    ${
                        application.status === "pending"
                        ?

                        `

                        <br><br>

                        <button
                            onclick="approveLoan('${applicationId}')"
                        >
                            ✅ Approve Loan
                        </button>


                        <button
                            onclick="rejectLoan('${applicationId}')"
                        >
                            ❌ Declare Not Eligible
                        </button>

                        `

                        :

                        ""

                    }

                </div>

            `;

        });


        applications.innerHTML =
            html;


    } catch (error) {

        console.error(
            "Loading applications error:",
            error
        );


        applications.innerHTML = `

            <p>
                ❌ Unable to load loan applications.
            </p>

            <p>
                ${escapeHTML(error.message)}
            </p>

        `;

    }

}


// ==========================================
// CALCULATE BALANCE ON SCREEN
// ==========================================

window.calculateBalance =
    function(applicationId) {

        const approved =
            Number(
                document.getElementById(
                    "approved-" + applicationId
                ).value
            ) || 0;


        const paid =
            Number(
                document.getElementById(
                    "paid-" + applicationId
                ).value
            ) || 0;


        const balance =
            Math.max(
                approved - paid,
                0
            );


        document.getElementById(
            "balance-" + applicationId
        ).textContent =
            "KSh " +
            balance.toLocaleString();

    };


// ==========================================
// SAVE LOAN INFORMATION
// ==========================================

window.saveLoan =
    async function(applicationId) {

        try {

            const applicationRef =
                doc(
                    db,
                    "loanApplications",
                    applicationId
                );


            const applicationSnap =
                await getDoc(applicationRef);


            if (!applicationSnap.exists()) {

                alert(
                    "Loan application not found."
                );

                return;
            }


            const application =
                applicationSnap.data();


            const approvedAmount =
                Number(
                    document.getElementById(
                        "approved-" + applicationId
                    ).value
                );


            const loanPaid =
                Number(
                    document.getElementById(
                        "paid-" + applicationId
                    ).value
                );


            const comment =
                document.getElementById(
                    "comment-" + applicationId
                ).value.trim();


            if (approvedAmount < 0) {

                alert(
                    "Approved loan amount cannot be negative."
                );

                return;
            }


            if (loanPaid < 0) {

                alert(
                    "Amount paid cannot be negative."
                );

                return;
            }


            if (loanPaid > approvedAmount) {

                alert(
                    "Amount paid cannot be greater than the approved loan."
                );

                return;
            }


            const loanBalance =
                approvedAmount - loanPaid;


            // ----------------------------------
            // UPDATE APPLICATION
            // ----------------------------------

            await updateDoc(
                applicationRef,
                {

                    approvedAmount:
                        approvedAmount,

                    loanPaid:
                        loanPaid,

                    loanBalance:
                        loanBalance,

                    adminComment:
                        comment,

                    updatedAt:
                        serverTimestamp()

                }
            );


            // ----------------------------------
            // UPDATE MEMBER ACCOUNT
            // ----------------------------------

            const memberRef =
                doc(
                    db,
                    "members",
                    application.userId
                );


            await updateDoc(
                memberRef,
                {

                    loanAmount:
                        approvedAmount,

                    loanPaid:
                        loanPaid,

                    loanBalance:
                        loanBalance

                }
            );


            alert(
                "✅ Loan information saved successfully."
            );


            await loadApplications();


        } catch (error) {

            console.error(
                "Save loan error:",
                error
            );


            alert(
                "Unable to save loan information: " +
                error.message
            );

        }

    };


// ==========================================
// APPROVE LOAN
// ==========================================

window.approveLoan =
    async function(applicationId) {

        try {

            const applicationRef =
                doc(
                    db,
                    "loanApplications",
                    applicationId
                );


            const applicationSnap =
                await getDoc(applicationRef);


            if (!applicationSnap.exists()) {

                alert(
                    "Loan application not found."
                );

                return;
            }


            const application =
                applicationSnap.data();


            const approvedAmount =
                Number(
                    document.getElementById(
                        "approved-" + applicationId
                    ).value
                );


            const loanPaid =
                Number(
                    document.getElementById(
                        "paid-" + applicationId
                    ).value
                );


            const comment =
                document.getElementById(
                    "comment-" + applicationId
                ).value.trim();


            if (approvedAmount <= 0) {

                alert(
                    "Enter the approved loan amount."
                );

                return;
            }


            if (loanPaid > approvedAmount) {

                alert(
                    "Amount paid cannot exceed the loan amount."
                );

                return;
            }


            const loanBalance =
                approvedAmount - loanPaid;


            // Update member
            const memberRef =
                doc(
                    db,
                    "members",
                    application.userId
                );


            await updateDoc(
                memberRef,
                {

                    loanAmount:
                        approvedAmount,

                    loanPaid:
                        loanPaid,

                    loanBalance:
                        loanBalance

                }
            );


            // Update application
            await updateDoc(
                applicationRef,
                {

                    status:
                        "approved",

                    adminDecision:
                        "approved",

                    approvedAmount:
                        approvedAmount,

                    loanPaid:
                        loanPaid,

                    loanBalance:
                        loanBalance,

                    adminComment:
                        comment,

                    reviewedAt:
                        serverTimestamp()

                }
            );


            alert(
                "✅ Loan approved successfully."
            );


            await loadApplications();


        } catch (error) {

            console.error(
                "Approval error:",
                error
            );


            alert(
                "Unable to approve loan: " +
                error.message
            );

        }

    };


// ==========================================
// REJECT APPLICATION
// ==========================================

window.rejectLoan =
    async function(applicationId) {

        try {

            const comment =
                document.getElementById(
                    "comment-" + applicationId
                ).value.trim();


            if (!comment) {

                alert(
                    "Please enter the reason why the member is not eligible."
                );

                return;
            }


            const applicationRef =
                doc(
                    db,
                    "loanApplications",
                    applicationId
                );


            await updateDoc(
                applicationRef,
                {

                    status:
                        "rejected",

                    adminDecision:
                        "not eligible",

                    adminComment:
                        comment,

                    reviewedAt:
                        serverTimestamp()

                }
            );


            alert(
                "Application marked as not eligible."
            );


            await loadApplications();


        } catch (error) {

            console.error(
                "Rejection error:",
                error
            );


            alert(
                "Unable to reject application: " +
                error.message
            );

        }

    };


// ==========================================
// ESCAPE HTML
// ==========================================

function escapeHTML(value) {

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}

</script>

</body>

    </html>
