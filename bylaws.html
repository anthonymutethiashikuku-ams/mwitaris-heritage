<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Bylaws - Mwitari's Heritage</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="login-container">

    <h1>📜 Mwitari's Heritage Bylaws</h1>

    <p id="loadingMessage">
        Loading bylaws...
    </p>

    <div id="bylawsContainer"></div>

    <br>

    <button onclick="location.href='dashboard.html'">
        🏠 Back to Dashboard
    </button>

</div>


<script type="module">

import { db } from "./firebase.js";

import {
    collection,
    getDocs,
    query,
    orderBy
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


const loadingMessage =
    document.getElementById("loadingMessage");

const bylawsContainer =
    document.getElementById("bylawsContainer");


// ==========================================
// LOAD BYLAWS
// ==========================================

async function loadBylaws() {

    try {

        const bylawsQuery =
            query(
                collection(db, "bylaws"),
                orderBy("order")
            );


        const snapshot =
            await getDocs(bylawsQuery);


        loadingMessage.textContent = "";


        if (snapshot.empty) {

            bylawsContainer.innerHTML = `

                <p>
                    No bylaws have been added yet.
                </p>

            `;

            return;
        }


        let html = "";


        snapshot.forEach((bylawDoc) => {

            const bylaw =
                bylawDoc.data();


            html += `

                <div
                    style="
                        margin-bottom: 25px;
                        padding: 15px;
                        border: 1px solid #ccc;
                        border-radius: 8px;
                        text-align: left;
                    "
                >

                    <h2>
                        ${escapeHTML(
                            bylaw.title || ""
                        )}
                    </h2>


                    <div class="bylaw-content">

                        ${sanitizeHTML(
                            bylaw.content || ""
                        )}

                    </div>

                </div>

            `;

        });


        bylawsContainer.innerHTML =
            html;


    } catch (error) {

        console.error(
            "Bylaws loading error:",
            error
        );


        loadingMessage.textContent =
            "Unable to load bylaws.";


        bylawsContainer.innerHTML = `

            <p>
                ${escapeHTML(error.message)}
            </p>

        `;

    }

}


// ==========================================
// ALLOW ONLY SAFE FORMATTING
// ==========================================

function sanitizeHTML(html) {

    const template =
        document.createElement("template");

    template.innerHTML = html;


    const allowedTags = [
        "B",
        "STRONG",
        "I",
        "EM",
        "U",
        "H1",
        "H2",
        "H3",
        "H4",
        "UL",
        "OL",
        "LI",
        "P",
        "BR"
    ];


    function cleanNode(node) {

        const children =
            Array.from(node.childNodes);


        children.forEach(child => {

            if (child.nodeType === Node.ELEMENT_NODE) {

                if (!allowedTags.includes(child.tagName)) {

                    const text =
                        document.createTextNode(
                            child.textContent
                        );

                    child.replaceWith(text);

                    return;
                }


                // Remove all attributes
                // such as onclick, style, href, etc.
                Array.from(child.attributes)
                    .forEach(attribute => {

                        child.removeAttribute(
                            attribute.name
                        );

                    });


                cleanNode(child);

            }

        });

    }


    cleanNode(template.content);


    return template.innerHTML;

}


// ==========================================
// ESCAPE NORMAL TEXT
// ==========================================

function escapeHTML(value) {

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


loadBylaws();

</script>

</body>

    </html>
