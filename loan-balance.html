<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Loan Balance - Mwitari's Heritage</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="login-container">

    <h1>💰 Loan Balance</h1>

    <p id="loadingMessage">
        Loading your loan information...
    </p>

    <div id="balanceResult"></div>

    <br>

    <button onclick="location.href='loans.html'">
        ← Back to Loans
    </button>

    <br><br>

    <button onclick="location.href='dashboard.html'">
        🏠 Back to Dashboard
    </button>

</div>


<script type="module">

import { auth, db } from "./firebase.js";

import {
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import {
    doc,
    getDoc
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


const loadingMessage =
    document.getElementById("loadingMessage");

const balanceResult =
    document.getElementById("balanceResult");


onAuthStateChanged(auth, async (user) => {

    // Make sure the member is logged in
    if (!user) {

        window.location.href =
            "index.html";

        return;
    }


    try {

        // Get the logged-in member's Firestore document
        const memberRef =
            doc(db, "members", user.uid);

        const memberSnap =
            await getDoc(memberRef);


        // Check whether the member exists
        if (!memberSnap.exists()) {

            loadingMessage.textContent =
                "Member information could not be found.";

            return;
        }


        const member =
            memberSnap.data();


        // Get the loan information
        const loanAmount =
            Number(member.loanAmount || 0);

        const loanPaid =
            Number(member.loanPaid || 0);

        const loanBalance =
            Number(member.loanBalance || 0);


        // Stop the loading message
        loadingMessage.textContent = "";


        // Display the actual member's loan information
        balanceResult.innerHTML = `

            <h2>Loan Details</h2>

            <p>
                <strong>Member Name:</strong>
                ${escapeHTML(member.fullName || "Not provided")}
            </p>

            <p>
                <strong>Membership No:</strong>
                ${escapeHTML(member.memberNumber || "Not provided")}
            </p>

            <hr>

            <p>
                <strong>Original Loan:</strong>
                KSh ${loanAmount.toLocaleString()}
            </p>

            <p>
                <strong>Amount Repaid:</strong>
                KSh ${loanPaid.toLocaleString()}
            </p>

            <p>
                <strong>Outstanding Balance:</strong>
                KSh ${loanBalance.toLocaleString()}
            </p>

        `;


    } catch (error) {

        console.error(
            "Loan balance loading error:",
            error
        );


        loadingMessage.textContent =
            "Unable to load your loan information.";


        balanceResult.innerHTML = `

            <p>
                ${escapeHTML(error.message)}
            </p>

        `;

    }

});


function escapeHTML(value) {

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}

</script>

</body>

</html>
