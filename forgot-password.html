<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Mwitari's Heritage - Forgot Password</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

<div class="login-container">

    <h1>Mwitari's Heritage</h1>

    <p>Reset Your Password</p>


    <form id="forgotPasswordForm">

        <input
            type="email"
            id="email"
            placeholder="Enter your registered email"
            autocomplete="email"
            required
        >


        <button
            type="submit"
            id="resetButton"
        >
            Send Password Reset Email
        </button>

    </form>


    <p id="message"
       style="margin-top: 15px;">
    </p>


    <br>


    <button
        type="button"
        onclick="location.href='index.html'"
    >
        Back to Login
    </button>

</div>



<script type="module">

    // ==========================================
    // FIREBASE
    // ==========================================

    import { auth } from "./firebase.js";


    import {
        sendPasswordResetEmail
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";



    // ==========================================
    // FORM ELEMENTS
    // ==========================================

    const form =
        document.getElementById(
            "forgotPasswordForm"
        );


    const emailInput =
        document.getElementById(
            "email"
        );


    const resetButton =
        document.getElementById(
            "resetButton"
        );


    const message =
        document.getElementById(
            "message"
        );



    // ==========================================
    // PASSWORD RESET
    // ==========================================

    form.addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();


            const email =
                emailInput.value
                    .trim()
                    .toLowerCase();


            // Clear previous message
            message.textContent = "";


            // Basic email validation
            if (!email) {

                message.textContent =
                    "Please enter your registered email address.";

                return;
            }


            // Prevent repeated clicks
            resetButton.disabled = true;

            resetButton.textContent =
                "Sending...";


            try {

                // Firebase sends the password-reset email
                await sendPasswordResetEmail(
                    auth,
                    email
                );


                /*
                 * Deliberately use a generic message.
                 *
                 * This prevents the page from revealing
                 * whether a particular email is registered.
                 */

                message.textContent =
                    "If an account is registered with this email, " +
                    "a password reset link has been sent. " +
                    "Please check your inbox and spam folder.";


                emailInput.value = "";


            } catch (error) {

                console.error(
                    "Password reset error:",
                    error
                );


                /*
                 * Do not reveal whether the email
                 * exists in Firebase Authentication.
                 */

                if (
                    error.code ===
                    "auth/invalid-email"
                ) {

                    message.textContent =
                        "Please enter a valid email address.";

                } else if (
                    error.code ===
                    "auth/too-many-requests"
                ) {

                    message.textContent =
                        "Too many password-reset attempts. " +
                        "Please wait and try again later.";

                } else {

                    message.textContent =
                        "We couldn't process the request right now. " +
                        "Please try again later.";

                }

            }


            // Enable button again
            resetButton.disabled = false;

            resetButton.textContent =
                "Send Password Reset Email";

        }
    );

</script>

</body>

  </html>
