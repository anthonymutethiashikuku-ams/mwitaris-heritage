<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Firebase Connection Test</title>
</head>

<body>
    <h1>Firebase Connection Test</h1>

    <p id="status">Testing Firebase...</p>

    <script type="module">
        import { initializeApp } 
            from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

        import { getFirestore, doc, setDoc, getDoc } 
            from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBCNRCrJMLE5rMk7ibraToPYCFVipCTn_k",
            authDomain: "mwitari-s-heritage-9f4ff.firebaseapp.com",
            projectId: "mwitari-s-heritage-9f4ff",
            storageBucket: "mwitari-s-heritage-9f4ff.firebasestorage.app",
            messagingSenderId: "314644112716",
            appId: "1:314644112716:web:405b8d26dc52730f0bdbe9",
            measurementId: "G-W39T3JZF34"
        };

        try {
            const app = initializeApp(firebaseConfig);

            const db = getFirestore(app);

            document.getElementById("status").innerHTML =
                "✅ Firebase initialized successfully.<br>Testing Firestore...";

            const testRef = doc(db, "connectionTest", "test");

            await setDoc(testRef, {
                message: "Mwitari's Heritage connection test",
                time: new Date().toISOString()
            });

            const testSnapshot = await getDoc(testRef);

            if (testSnapshot.exists()) {
                document.getElementById("status").innerHTML =
                    "🎉 SUCCESS! Firebase and Firestore are connected.<br>" +
                    "Project: mwitari-s-heritage-9f4ff";
            } else {
                document.getElementById("status").innerHTML =
                    "⚠️ Firebase connected, but the test document could not be read.";
            }

        } catch (error) {

            document.getElementById("status").innerHTML =
                "❌ CONNECTION FAILED<br><br>" +
                "Error code: " + error.code + "<br>" +
                "Message: " + error.message;
            
            console.error(error);
        }
    </script>

</body>
</html>
