<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Firebase Document Test</title>
</head>

<body>

<h2>Firebase Document Test</h2>

<button id="testBtn">Check Member Document</button>

<pre id="result">Press the button...</pre>

<script type="module">

import { db } from "./firebase.js?v=3";

import {
    doc,
    getDoc
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

const result = document.getElementById("result");

document.getElementById("testBtn").onclick = async () => {

    result.textContent = "Checking...\n";

    try {

        const memberRef = doc(
            db,
            "members",
            "II2LfPfbC8UT7ezGPsDejA2awHE3"
        );

        const snapshot = await getDoc(memberRef);

        result.textContent +=
            "Document exists: " + snapshot.exists() + "\n\n";

        if (snapshot.exists()) {
            result.textContent +=
                JSON.stringify(snapshot.data(), null, 2);
        } else {
            result.textContent +=
                "Firebase cannot find this document.";
        }

    } catch (error) {

        result.textContent =
            "ERROR\n\n" +
            "Code: " + error.code + "\n" +
            "Message: " + error.message;

        console.error(error);
    }
};

</script>

</body>
</html>
