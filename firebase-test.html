<!DOCTYPE html>
<html>
<head>
    <title>Firebase Test</title>
</head>
<body>

<h2>Firebase Connection Test</h2>
<p id="result">Testing...</p>

<script type="module">
import { db } from "./firebase.js";

import {
    collection,
    getDocs,
    getDoc,
    doc
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

const result = document.getElementById("result");

try {
    const test = await getDoc(
        doc(db, "members", "II2LfPfbC8UT7ezGPsDejA2awHE3")
    );

    if (test.exists()) {
        result.innerHTML =
            "SUCCESS — Firestore can read the member document.";
    } else {
        result.innerHTML =
            "CONNECTED — but that document does not exist.";
    }

} catch (error) {
    result.innerHTML =
        "ERROR: " + error.code + "<br>" + error.message;
}
</script>

</body>
</html>
